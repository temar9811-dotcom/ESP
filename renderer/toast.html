<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        background: transparent;
        overflow: hidden;
        font-family: 'Segoe UI', Arial, sans-serif;
      }

      #toast-stack {
        position: fixed;
        bottom: 0;
        right: 0;
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        gap: 10px;
      }

      .toast-bubble {
        width: 340px;
        background: rgba(20, 26, 34, 0.95);
        border: 1px solid rgba(90, 140, 190, 0.5);
        border-radius: 10px;
        padding: 12px 14px;
        color: #e8eef5;
        box-shadow: 0 6px 18px rgba(0, 0, 0, 0.45);
        animation: toast-in 0.25s ease-out;
      }

      .toast-title {
        font-weight: 700;
        margin-bottom: 4px;
      }

      .toast-body {
        font-size: 13px;
        line-height: 1.4;
        word-break: break-word;
      }

      @keyframes toast-in {
        from {
          transform: translateY(12px);
          opacity: 0;
        }
        to {
          transform: translateY(0);
          opacity: 1;
        }
      }
    </style>
  </head>
  <body>
    <div id="toast-stack"></div>

    <script>
      const stack = document.getElementById('toast-stack');
      let audioCtx = null;

      function playChime(kind) {
        try {
          audioCtx =
            audioCtx ||
            new (window.AudioContext || window.webkitAudioContext)();

          let notes = null;
          let wave = 'sine';
          let spacing = 0.12;

          if (kind === 'skill') {
            notes = [880, 1174.66, 1567.98];
          } else if (kind === 'wallet') {
            notes = [523.25, 659.25];
            wave = 'triangle';
          } else if (kind === 'queue') {
            notes = [659.25, 523.25, 392];
            wave = 'triangle';
            spacing = 0.15;
          }

          if (!notes) return;

          notes.forEach((freq, i) => {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();

            osc.type = wave;
            osc.frequency.value = freq;

            const start = audioCtx.currentTime + i * spacing;

            gain.gain.setValueAtTime(0.0001, start);
            gain.gain.exponentialRampToValueAtTime(0.25, start + 0.02);
            gain.gain.exponentialRampToValueAtTime(0.0001, start + 0.35);

            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start(start);
            osc.stop(start + 0.4);
          });
        } catch {
          // Audio not available.
        }
      }

      if (!window.toastApi) {
        console.error('overlay: toastApi is missing!');
      } else {
        console.log('overlay: listening for toasts');

        window.toastApi.onToast((payload) => {
          console.log('overlay: got toast', payload);

          if (payload.sound) {
            playChime(payload.sound);
          }

          const bubble = document.createElement('div');
          bubble.className = 'toast-bubble';

          const title = document.createElement('div');
          title.className = 'toast-title';
          title.textContent = payload.title || '';

          const body = document.createElement('div');
          body.className = 'toast-body';
          body.textContent = payload.body || '';

          bubble.appendChild(title);
          bubble.appendChild(body);
          stack.appendChild(bubble);

          while (stack.children.length > 5) {
            stack.removeChild(stack.firstChild);
          }

          setTimeout(() => {
            bubble.remove();
          }, 8000);
        });
      }
    </script>
  </body>
</html>
