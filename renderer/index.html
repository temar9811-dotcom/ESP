<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EVE Status Perception</title>

    <link rel="stylesheet" href="styles.css" />

    <script defer src="utils.js"></script>
    <script defer src="toasts.js"></script>
    <script defer src="state.js"></script>
    <script defer src="render.js"></script>
    <script defer src="modals.js"></script>
    <script defer src="modal-plans.js"></script>
    <script defer src="modal-accounts.js"></script>
    <script defer src="modal-settings.js"></script>
    <script defer src="loaders.js"></script>
    <script defer src="render-list.js"></script>
    <script defer src="bind-modals.js"></script>
    <script defer src="bind-accounts.js"></script>
    <script defer src="refresh-state.js"></script>
    <script defer src="recent-skills.js"></script>
    <script defer src="assets.js"></script>
    <script defer src="init.js"></script>
    <script defer src="test-panel.js"></script>
  </head>

  <body>
    <header class="topbar">
      <h1>
        EVE Status Perception
        <span id="version" class="version"></span>
      </h1>

      <div class="actions">
        <button id="addPlan" type="button">Add plan from clipboard</button>
        <button id="refresh" type="button">Refresh</button>
        <button id="add" type="button">Add character</button>
        <button id="settings" type="button">Settings</button>
        <div id="sync-indicator" class="sync-indicator" aria-hidden="true">
          <div class="sync-spinner"></div>
          <div class="sync-popup" role="status"></div>
        </div>
      </div>
    </header>

    <div id="status" class="status" role="status" aria-live="polite"></div>

    <main id="accounts" class="app-main"></main>

    <div id="modal-root"></div>

    <div id="toast-root" class="toast-root" aria-live="polite"></div>

    <div id="eve-time" class="eve-time"></div>
  </body>
</html>
