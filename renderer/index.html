<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EVE Status Perception</title>

    <link rel="stylesheet" href="styles.css" />

    <script defer src="utils.js"></script>
    <script defer src="toasts.js"></script>
    <script defer src="state.js"></script>
    <script defer src="render.js"></script>
    <script defer src="modals.js"></script>
    <script defer src="events.js"></script>
    <script defer src="test-panel.js"></script>
  </head>

  <body>
    <header class="topbar">
      <h1>
        EVE Status Perception
        <span id="version" class="version"></span>
      </h1>

      <div class="actions">
        <button id="addPlan" type="button">Add plan from clipboard</button>
        <button id="refresh" type="button">Refresh</button>
        <button id="add" type="button">Add character</button>
      </div>
    </header>

    <div id="status" class="status" role="status" aria-live="polite"></div>

    <main id="accounts" class="sidebar"></main>

    <div id="modal-root"></div>

    <div id="toast-root" class="toast-root" aria-live="polite"></div>

    <div id="eve-time" class="eve-time"></div>
  </body>
</html>
